<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141a20">
  <title>Codec Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script defer src="/lucide.min.js"></script>
  <script defer src="/app.js"></script>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="/favicon.svg" alt="" width="31" height="31"><span>codec<span
            class="brand-light">tracker</span></span></div>
      <nav class="navigation" aria-label="Sections">
        <button class="nav-item active" data-view="latest" aria-current="page">Latest</button>
        <button class="nav-item" data-view="sonarr">Sonarr</button>
        <button class="nav-item" data-view="radarr">Radarr</button>
      </nav>
      <button id="refresh" class="refresh-button" type="button" title="Refresh library"><i data-lucide="refresh-cw"
          aria-hidden="true"></i><span>Refresh</span></button>
    </header>

    <main class="workspace">
      <div class="page-heading">
        <div>
          <span class="eyebrow">MEDIA / CODEC INSIGHTS</span>
          <h1 id="page-title">Latest</h1>
          <p id="page-description">Recently added episodes and movies across your libraries.</p>
        </div>
        <div id="stats" class="stats" aria-live="polite">
          <div><strong id="stat-series">—</strong><span>Series</span></div>
          <div title="Episodes with files"><strong id="stat-episodes">—</strong><span>Episodes</span></div>
          <div><strong id="stat-movies">—</strong><span>Movies</span></div>
          <div><strong id="stat-files">—</strong><span>Files</span></div>
        </div>
      </div>

      <div id="toolbar" class="toolbar">
        <label class="search-field"><i data-lucide="search" aria-hidden="true"></i><span class="sr-only">Search titles
            and episodes</span><input id="search" type="search" autocomplete="off"
            placeholder="Search titles or episodes"></label>
        <div class="filters">
          <label class="select-wrap" id="source-wrap"><span>Source</span><select id="source" aria-label="Filter source">
              <option value="all">All services</option>
              <option value="sonarr">Sonarr</option>
              <option value="radarr">Radarr</option>
            </select></label>
          <label class="select-wrap" id="period-wrap"><span>Added</span><select id="period" aria-label="Date range">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
              <option value="0">All time</option>
            </select></label>
          <label class="select-wrap"><span>Codec</span><select id="codec" aria-label="Filter codec">
              <option value="">All codecs</option>
            </select></label>
          <label class="select-wrap"><span>Resolution</span><select id="resolution" aria-label="Filter resolution">
              <option value="">All resolutions</option>
            </select></label>
          <label class="select-wrap"><span>Sort</span><select id="sort" aria-label="Sort by">
              <option value="date">Date added</option>
              <option value="title">Title</option>
              <option value="release">Release date</option>
              <option value="codec">Codec</option>
              <option value="resolution">Resolution</option>
              <option value="size">Size</option>
            </select></label>
          <label class="select-wrap" id="page-size-wrap" hidden><span>Rows</span><select id="page-size"
              aria-label="Rows per page">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="250" selected>250</option>
              <option value="500">500</option>
            </select></label>
          <button id="direction" class="icon-button" type="button" title="Sort descending"
            aria-label="Sort descending"><i data-lucide="arrow-down-wide-narrow" aria-hidden="true"></i></button>
        </div>
      </div>

      <div id="notice" class="notice" role="status" hidden></div>
      <div id="content" aria-live="polite"></div>
    </main>
  </div>

  <aside id="detail" class="detail-panel" aria-label="Series episodes" hidden>
    <div class="detail-top"><span class="eyebrow">SONARR / SERIES</span><button id="close-detail" class="icon-button"
        type="button" title="Close details" aria-label="Close details"><i data-lucide="x"
          aria-hidden="true"></i></button></div>
    <h2 id="detail-title"></h2>
    <p id="detail-subtitle"></p>
    <div class="detail-controls">
      <label class="select-wrap"><span>Sort</span><select id="detail-sort" aria-label="Sort episodes">
          <option value="episode">Episode number</option>
          <option value="title">Title</option>
          <option value="release">Air date</option>
          <option value="date">Date added</option>
          <option value="codec">Codec</option>
          <option value="resolution">Resolution</option>
          <option value="size">Size</option>
        </select></label>
      <button id="detail-direction" class="icon-button" type="button" title="Sort ascending"
        aria-label="Sort ascending"><i data-lucide="arrow-up-narrow-wide" aria-hidden="true"></i></button>
    </div>
    <div id="detail-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
</body>

</html>
